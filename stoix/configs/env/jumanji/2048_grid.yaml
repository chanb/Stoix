# ---Environment Configs---
# Same as jumanji/2048.yaml but instead of flattening (which also collapses the
# 2D board into a 1D vector), this uses GridObservationWrapper to keep the
# (4, 4) spatial structure, casting to float32 and adding a trailing singleton
# channel axis - (4, 4, 1) - so a CNN-based network (network=cnn_mlp_compute /
# cnn_mlp_compute_qac / cnn_transformer_compute / cnn_transformer_compute_qac)
# can operate on the real board layout. The dtype cast is also
# required for `env.observation_space().generate_value()` to work at all here:
# the board is unbounded (int32, no declared bounds), and stoa's ArraySpace.sample()
# only supports float/complex dtypes - see stoix/wrappers/grid_observation.py.
# Plain MLP-based networks (mlp_compute etc.) should keep using env=jumanji/2048.
env_name: jumanji
observation_attribute : board
multi_agent : False

scenario:
  name: Game2048-v1
  task_name: game_2048

kwargs: {}

# Defines the metric that will be used to evaluate the performance of the agent.
# This metric is returned at the end of an experiment and can be used for hyperparameter tuning.
eval_metric: episode_return

wrapper:
  _target_: stoix.wrappers.grid_observation.GridObservationWrapper
  dtype: float32
  add_channel_dim: True
