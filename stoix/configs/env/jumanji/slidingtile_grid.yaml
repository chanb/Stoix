# ---Environment Configs---
# Same as jumanji/slidingtile.yaml but instead of flattening, this uses
# GridObservationWrapper to keep the (grid_size, grid_size) spatial
# structure, casting to float32 and adding a trailing singleton channel axis
# - (grid_size, grid_size, 1) - so a CNN-based network (network=cnn_mlp_compute
# / cnn_mlp_compute_qac / cnn_transformer_compute / cnn_transformer_compute_qac)
# can operate on the real puzzle layout. The `puzzle` observation attribute
# alone is sufficient here (the blank tile's position is recoverable from it -
# see slidingtile.yaml). Plain MLP-based networks (mlp_compute etc.) should
# keep using env=jumanji/slidingtile.
env_name: jumanji
observation_attribute: puzzle
multi_agent: False

scenario:
  name: SlidingTilePuzzle-v0
  task_name: slidingtile

kwargs:
  generator:
    _target_: jumanji.environments.logic.sliding_tile_puzzle.generator.RandomWalkGenerator
    grid_size: 3
    num_random_moves: 10

# Defines the metric that will be used to evaluate the performance of the agent.
# This metric is returned at the end of an experiment and can be used for hyperparameter tuning.
eval_metric: episode_return

wrapper:
  _target_: stoix.wrappers.grid_observation.GridObservationWrapper
  dtype: float32
  add_channel_dim: True
