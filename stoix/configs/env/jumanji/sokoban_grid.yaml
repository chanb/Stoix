# ---Environment Configs---
# Same as jumanji/sokoban.yaml but without the FlattenObservationWrapper - the
# observation stays a genuine (height, width, channels) grid, for use with a
# CNN-based network (e.g. network=cnn_mlp_compute / cnn_mlp_compute_qac /
# cnn_transformer_compute / cnn_transformer_compute_qac) that needs the
# spatial structure. Plain MLP-based networks (mlp_compute etc.) expect a flat
# vector and should use env=jumanji/sokoban instead.
#
# The raw `grid` field bundles unrelated object types into two channels of
# small integer codes (agent/box in one, wall/target in the other - see
# stoix/wrappers/sokoban_grid.py), which would make a CNN treat them as
# ordinally related. SokobanGridObservationWrapper one-hot encodes it into
# four semantic channels (agent, box, wall, target) instead, mirroring
# jumanji's own `make_sokoban_cnn` preprocessing
# (jumanji.training.networks.sokoban.actor_critic.preprocess_input).
env_name: jumanji
observation_attribute : grid
multi_agent : False

scenario:
  name: Sokoban-v0
  task_name: sokoban

# See jumanji/sokoban.yaml: overrides jumanji's default reward_fn (DenseReward,
# which adds a constant -0.1 per-step penalty) to drop that per-step term -
# see stoix/envs/sokoban/reward.py.
kwargs:
  reward_fn:
    _target_: stoix.envs.sokoban.reward.DenseRewardNoStepPenalty

# An episode counts as solved if its final step's reward is at least this - the
# one-off +10 LEVEL_COMPLETE_BONUS (jumanji.environments.routing.sokoban.
# constants) lands on the terminating step, whereas nothing else in the reward
# exceeds SINGLE_BOX_BONUS = 1. Unlike a return threshold, this holds with or
# without the -0.1 per-step penalty from jumanji's default reward_fn, under
# which a solve at step 120 returns about the same as an unsolved 3-box episode.
# Logged as actor/solved_episode/mean (training) and evaluator/solved_episode/mean
# (evaluation) - see stoix.systems.ramdp_vpg.ramdp_vpg_types.solved_episode_info
# and stoix.systems.ramdp_vpg.evaluator.
solved_final_reward_threshold: 10.0

# Defines the metric that will be used to evaluate the performance of the agent.
# This metric is returned at the end of an experiment and can be used for hyperparameter tuning.
eval_metric: episode_return

wrapper:
  _target_: stoix.wrappers.sokoban_grid.SokobanGridObservationWrapper
