# ---Environment Configs---
# Lights Out puzzle on a 3x3 grid (see stoix.envs.lightsout.lightsout_env).
# `m`/`n` are parsed from `scenario.name` ("lightsout-<m>x<n>"), not set here.
env_name: lightsout

scenario:
  name: lightsout-3x3
  task_name: lightsout_3x3

kwargs:
  # Goals reachable in < difficulty_threshold * grid_size presses are sampled
  # during training ("easy"); the eval environment samples from
  # [difficulty_threshold * grid_size, grid_size) instead ("hard").
  difficulty_threshold: 0.5
  # Defaults to m * n (grid_size) if omitted.
  episode_length: 6

# Defines the metric that will be used to evaluate the performance of the agent.
# This metric is returned at the end of an experiment and can be used for hyperparameter tuning.
eval_metric: episode_return