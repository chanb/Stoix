# ---CNN Compute-Time-Aware Q Actor-Critic Networks---
# Same CNN + MLP input_layer as cnn_compute.yaml (see that file's comment for the
# jumanji-Sokoban-network rationale) feeding an AdaptiveComputationTimeTorso actor.
# The critic is stoix.networks.base_qac.ValueAndQCritic, matching
# mlp_compute_qac.yaml: one torso, a scalar value_head V(s), and a q_head whose
# output shape depends on system.qac_variant - a full (num_actions, max_steps)
# table for "naive", or just (num_actions,) - Q(s,·,1) - for the
# runtime-factorized "fac" variant. output_dim/pre_shape for both heads are
# injected in code, not set here.
actor_network:
  input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False # jumanji's grid observation is already (H, W, C).
    hidden_sizes: [128]
  pre_torso:
    _target_: stoix.networks.torso_compute.AdaptiveComputationTimeTorso
    hidden_dim: 128
    max_steps: 10
    min_steps: 1
    activation: relu
  action_head:
    _target_: stoix.networks.heads.CategoricalHead

critic_network:
  input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False
    hidden_sizes: [128]
  pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: relu
  value_head:
    _target_: stoix.networks.heads.ScalarCriticHead
  q_head:
    _target_: stoix.networks.heads.MLPHead
    hidden_sizes: []
    activation: relu
    use_layer_norm: False
