# ---CNN+MLP Compute-Time-Aware Q Actor-Critic Networks (separate V/Q torsos)---
# Same CNN input_layer + AdaptiveComputationTimeTorso actor as
# cnn_mlp_compute_qac.yaml. The critic is
# stoix.networks.base_qac.SeparateValueAndQCritic instead of
# cnn_mlp_compute_qac.yaml's shared-torso ValueAndQCritic: V and Q each get
# their own CNNTorso input_layer and MLPTorso (independently initialised, no
# shared parameters at all) - selected in code by the presence of
# `value_pre_torso`/`q_pre_torso` here instead of a single `pre_torso` (see
# ff_qac.py's/ff_ppo.py's learner_setup). q_head's output shape still
# depends on system.qac_variant, exactly as in cnn_mlp_compute_qac.yaml.
actor_network:
  input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False # jumanji's grid observation is already (H, W, C).
    hidden_sizes: [128]
  pre_torso:
    _target_: stoix.networks.torso_compute.AdaptiveComputationTimeTorso
    hidden_dim: 128
    max_steps: 10
    min_steps: 1
    activation: relu
    use_input_layer_norm: False
    use_layer_norm: False
  action_head:
    _target_: stoix.networks.heads.CategoricalHead

critic_network:
  value_input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False
    hidden_sizes: [128]
  q_input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False
    hidden_sizes: [128]
  value_pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: relu
  q_pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: relu
  value_head:
    _target_: stoix.networks.heads.ScalarCriticHead
  q_head:
    _target_: stoix.networks.heads.MLPHead
    hidden_sizes: []
    activation: relu
    use_layer_norm: False
