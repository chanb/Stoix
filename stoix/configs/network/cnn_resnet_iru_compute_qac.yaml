# ---CNN(ResNet)+IRU Compute-Time-Aware Q Actor-Critic Networks---
# Same CNN(ResNet)+IRU actor as cnn_resnet_iru_compute.yaml (see that file's
# comment for the "Boxpick" architecture spec this matches), paired with the
# same QAC critic head structure as cnn_iru_compute_qac.yaml (see that
# file's comment) - stoix.networks.base_qac.ValueAndQCritic, a scalar value
# head V(s) plus a q_head whose output shape depends on system.qac_variant.
# output_dim/pre_shape for both heads are injected in code, not set here.
actor_network:
  input_layer:
    _target_: stoix.networks.resnet.VisualResNetTorso
    channels_per_group: [256]
    blocks_per_group: [2]
    layers_per_block: 4
    downsampling_strategies: ["none"]
    use_layer_norm: False
    activation: relu
    channel_first: False # BoxMovingToStoa's grid observation is already (H, W, C).
    hidden_sizes: [256]
    normalize_inputs: False # observation is already a {0, 1} factored-channel encoding.
  pre_torso:
    _target_: stoix.networks.torso_compute.IRUAdaptiveComputationTimeTorso
    hidden_dim: 256
    max_steps: 10
    min_steps: 1
    use_input_layer_norm: False
  action_head:
    _target_: stoix.networks.heads.CategoricalHead

critic_network:
  input_layer:
    _target_: stoix.networks.resnet.VisualResNetTorso
    channels_per_group: [256]
    blocks_per_group: [2]
    layers_per_block: 4
    downsampling_strategies: ["none"]
    use_layer_norm: False
    activation: relu
    channel_first: False
    hidden_sizes: [256]
    normalize_inputs: False
  pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: relu
  value_head:
    _target_: stoix.networks.heads.ScalarCriticHead
  q_head:
    _target_: stoix.networks.heads.MLPHead
    hidden_sizes: []
    activation: relu
    use_layer_norm: False
