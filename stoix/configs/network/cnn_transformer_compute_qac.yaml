# ---CNN+Transformer Compute-Time-Aware Q Actor-Critic Networks---
# Same CNN + transformer actor as cnn_transformer_compute.yaml (see that
# file's comment for the TransformerChainOfThoughtTorso rationale). The
# critic is stoix.networks.base_qac.ValueAndQCritic, matching
# mlp_compute_qac.yaml: one torso, a scalar value_head V(s), and a q_head
# whose output shape depends on system.qac_variant (see ff_qac.py's
# learner_setup and module docstring) - a full (num_actions, max_steps) table
# for "naive", or just (num_actions,) - Q(s,·,1) - for the runtime-factorized
# "fac" variant. output_dim/pre_shape for both heads are injected in code,
# not set here.
actor_network:
  input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False # jumanji's grid observation is already (H, W, C).
    hidden_sizes: [128]
  pre_torso:
    _target_: stoix.networks.torso_compute_transformer.TransformerChainOfThoughtTorso
    hidden_dim: 128
    num_heads: 4
    num_layers: 2
    mlp_dim: 256
    max_steps: 8
    min_steps: 1 # Forbids halting before this many steps; set equal to max_steps for a
      # fixed-budget, non-adaptive baseline.
    activation: relu
    use_input_layer_norm: False
  action_head:
    _target_: stoix.networks.heads.CategoricalHead

critic_network:
  input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False
    hidden_sizes: [128]
  pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: relu
  value_head:
    _target_: stoix.networks.heads.ScalarCriticHead
  q_head:
    _target_: stoix.networks.heads.MLPHead
    hidden_sizes: []
    activation: relu
    use_layer_norm: False
