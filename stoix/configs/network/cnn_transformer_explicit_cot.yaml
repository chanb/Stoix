# ---CNN+Explicit-CoT-Transformer Compute-Time-Aware REINFORCE Networks---
# Same CNN input_layer as cnn_transformer_compute.yaml (see that file's
# comment for the jumanji-Sokoban-network rationale) for grid/pixel
# observations, but feeding TransformerExplicitCoTTorso instead of the
# latent-CoT TransformerChainOfThoughtTorso: at each step it samples a
# discrete thought token from a learned vocabulary (a genuine, inspectable
# output of the policy) that has one extra class meaning "predict the
# environment action now" - see
# stoix.networks.torso_compute_explicit_cot.TransformerExplicitCoTTorso.
actor_network:
  input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False # jumanji's grid observation is already (H, W, C).
    hidden_sizes: [128]
  pre_torso:
    _target_: stoix.networks.torso_compute_explicit_cot.TransformerExplicitCoTTorso
    hidden_dim: 128
    vocab_size: 32
    num_heads: 4
    num_layers: 2
    mlp_dim: 256
    max_steps: 8
    min_steps: 1 # Forbids halting before this many steps; set equal to max_steps for a
      # fixed-budget, non-adaptive baseline.
    activation: gelu
  action_head:
    _target_: stoix.networks.heads.CategoricalHead

critic_network:
  input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False
    hidden_sizes: [128]
  pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: relu
  critic_head:
    _target_: stoix.networks.heads.ScalarCriticHead
