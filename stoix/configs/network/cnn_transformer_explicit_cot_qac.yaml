# ---CNN+Explicit-CoT-Transformer Compute-Time-Aware Q Actor-Critic Networks (shared V/Q torso)---
# Same CNN input_layer + TransformerExplicitCoTTorso actor as
# cnn_transformer_explicit_cot.yaml. The critic is
# stoix.networks.base_qac.ValueAndQCritic, matching
# cnn_transformer_compute_qac.yaml/cnn_mlp_compute_qac.yaml: one CNN
# input_layer + MLPTorso, a scalar value_head V(s), and a q_head whose output
# shape depends on system.qac_variant (see ff_ppo_explicit_cot.py's
# learner_setup and module docstring) - selected in code by the presence of
# a single `pre_torso` (and `input_layer`) here rather than
# `value_pre_torso`/`q_pre_torso` (`value_input_layer`/`q_input_layer`), see
# cnn_transformer_explicit_cot_qac_separate_qv.yaml for the separate-torso
# variant. output_dim/pre_shape for both heads are injected in code, not set
# here.
actor_network:
  input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False # jumanji's grid observation is already (H, W, C).
    hidden_sizes: [128]
  pre_torso:
    _target_: stoix.networks.torso_compute_explicit_cot.TransformerExplicitCoTTorso
    hidden_dim: 128
    vocab_size: 32
    num_heads: 4
    num_layers: 2
    mlp_dim: 256
    max_steps: 8
    min_steps: 1 # Forbids halting before this many steps; set equal to max_steps for a
      # fixed-budget, non-adaptive baseline.
    activation: gelu
    use_latent_feedback: False # Full-Bandwidth Transformer's latent feedback decoding
      # (arXiv:2608.08888) - fuses the previous step's top-layer hidden state into the
      # next scratchpad entry via a gated linear unit instead of feeding back only the
      # sampled token's bare embedding. See torso_compute_explicit_cot.py.
  action_head:
    _target_: stoix.networks.heads.CategoricalHead

critic_network:
  input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False
    hidden_sizes: [128]
  pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: relu
  value_head:
    _target_: stoix.networks.heads.ScalarCriticHead
  q_head:
    _target_: stoix.networks.heads.MLPHead
    hidden_sizes: [64]
    activation: relu
    use_layer_norm: False
