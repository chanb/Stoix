# ---CNN+Explicit-CoT-Transformer Compute-Time-Aware Q Actor-Critic Networks (separate V/Q torsos)---
# Same CNN input_layer + TransformerExplicitCoTTorso actor as
# cnn_transformer_explicit_cot.yaml. The critic is
# stoix.networks.base_qac.SeparateValueAndQCritic: V and Q each get their own
# CNNTorso input_layer and MLPTorso (independently initialised, no shared
# parameters at all) - selected in code by the presence of
# `value_pre_torso`/`q_pre_torso` here instead of a single `pre_torso` (see
# ff_qac.py's/ff_ppo.py's/ff_ppo_explicit_cot.py's learner_setup). q_head's
# output shape still depends on system.qac_variant, exactly as in
# cnn_transformer_compute_qac_separate_qv.yaml.
actor_network:
  input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False # jumanji's grid observation is already (H, W, C).
    hidden_sizes: [128]
  pre_torso:
    _target_: stoix.networks.torso_compute_explicit_cot.TransformerExplicitCoTTorso
    hidden_dim: 128
    vocab_size: 32
    num_heads: 4
    num_layers: 2
    mlp_dim: 256
    max_steps: 8
    min_steps: 1 # Forbids halting before this many steps; set equal to max_steps for a
      # fixed-budget, non-adaptive baseline.
    activation: gelu
    use_latent_feedback: False # Full-Bandwidth Transformer's latent feedback decoding
      # (arXiv:2608.08888) - fuses the previous step's top-layer hidden state into the
      # next scratchpad entry via a gated linear unit instead of feeding back only the
      # sampled token's bare embedding. See torso_compute_explicit_cot.py.
  action_head:
    _target_: stoix.networks.heads.CategoricalHead

critic_network:
  value_input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False
    hidden_sizes: [128]
  q_input_layer:
    _target_: stoix.networks.torso.CNNTorso
    channel_sizes: [32, 64]
    kernel_sizes: [3, 3]
    strides: [1, 1]
    use_layer_norm: False
    activation: relu
    channel_first: False
    hidden_sizes: [128]
  value_pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: relu
  q_pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: relu
  value_head:
    _target_: stoix.networks.heads.ScalarCriticHead
  q_head:
    _target_: stoix.networks.heads.MLPHead
    hidden_sizes: []
    activation: relu
    use_layer_norm: False
