# ---MLP Compute-Time-Aware REINFORCE Networks---
# The actor's pre_torso is an Adaptive Computation Time torso: it repeatedly
# applies a shared computation step, sampling a "halt now?" decision at each
# step from a learned probability, and reports the actual (sampled) number of
# steps taken as `compute_time` (see
# stoix.networks.torso_compute.AdaptiveComputationTimeTorso).
actor_network:
  pre_torso:
    _target_: stoix.networks.torso_compute.AdaptiveComputationTimeTorso
    hidden_dim: 256
    max_steps: 10
    min_steps: 1 # Forbids halting before this many steps; set equal to max_steps for a
      # fixed-budget, non-adaptive baseline.
    activation: relu
    use_input_layer_norm: False
    use_layer_norm: False
  action_head:
    _target_: stoix.networks.heads.CategoricalHead

critic_network:
  pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: relu
  critic_head:
    _target_: stoix.networks.heads.ScalarCriticHead
