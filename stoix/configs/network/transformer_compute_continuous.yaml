# ---Transformer Chain-of-Thought Compute-Time-Aware Continuous PPO Networks---
# Like transformer_compute.yaml (used by ff_ppo.py's/ff_reinforce.py's
# "reinforce" qac_variant), except the actor's action_head is a continuous
# (Tanh-squashed Normal) distribution instead of a Categorical one - for
# stoix.systems.ramdp_vpg.ff_ppo_continuous, which only supports "reinforce".
# The actor's pre_torso is still a Chain-of-Thought transformer torso: it
# grows a scratchpad of "thought" tokens, attending over all of them so far
# at each step, and samples a "keep thinking?" decision at each step from a
# learned probability. The actual (sampled) number of CoT steps taken is
# reported as `compute_time` (see
# stoix.networks.torso_compute_transformer.TransformerChainOfThoughtTorso).
actor_network:
  pre_torso:
    _target_: stoix.networks.torso_compute_transformer.TransformerChainOfThoughtTorso
    hidden_dim: 128
    num_heads: 4
    num_layers: 2
    mlp_dim: 256
    max_steps: 8
    min_steps: 1 # Forbids halting before this many steps; set equal to max_steps for a
      # fixed-budget, non-adaptive baseline.
    activation: gelu
    use_input_layer_norm: False
  action_head:
    _target_: stoix.networks.heads.NormalAffineTanhDistributionHead
    # action_dim/minimum/maximum are filled in at runtime from the env's
    # action space - see ff_ppo_continuous.py's learner_setup.

critic_network:
  pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: relu
  critic_head:
    _target_: stoix.networks.heads.ScalarCriticHead
