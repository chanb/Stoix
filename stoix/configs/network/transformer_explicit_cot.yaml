# ---Explicit Chain-of-Thought Compute-Time-Aware REINFORCE Networks---
# The actor's pre_torso is an explicit Chain-of-Thought transformer torso: at
# each step it samples a discrete token from a learned vocabulary (a genuine,
# inspectable output of the policy) that has one extra class beyond
# `vocab_size` meaning "predict the environment action now" - choosing a
# thought token feeds that token's embedding back in as context for the next
# step, choosing the extra class halts. The actual (sampled) number of CoT
# steps taken is reported as `compute_time` (see
# stoix.networks.torso_compute_explicit_cot.TransformerExplicitCoTTorso).
actor_network:
  pre_torso:
    _target_: stoix.networks.torso_compute_explicit_cot.TransformerExplicitCoTTorso
    hidden_dim: 128
    vocab_size: 32
    num_heads: 4
    num_layers: 2
    mlp_dim: 256
    max_steps: 8
    min_steps: 1 # Forbids halting before this many steps; set equal to max_steps for a
      # fixed-budget, non-adaptive baseline.
    activation: gelu
  action_head:
    _target_: stoix.networks.heads.CategoricalHead

critic_network:
  pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: relu
  critic_head:
    _target_: stoix.networks.heads.ScalarCriticHead
