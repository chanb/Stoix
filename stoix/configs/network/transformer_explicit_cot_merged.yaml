# ---Merged-Action Explicit Chain-of-Thought Compute-Time-Aware PPO Networks---
# Same explicit-CoT transformer torso idea as transformer_explicit_cot.yaml,
# but the environment action is folded into the same vocabulary as the
# thought tokens instead of being decided by a separate action_head: at each
# step it samples a discrete token from a learned vocabulary that has
# `num_actions` extra classes beyond `vocab_size` - one per environment
# action - so choosing one of them both halts *and* resolves the action in
# the same draw. `num_actions` is injected at runtime (from the env's action
# space), same as `action_dim` used to be for action_head - see
# stoix.networks.torso_compute_explicit_cot_merged.TransformerMergedActionCoTTorso.
# No action_head here: the torso is a complete actor on its own (see
# stoix.networks.base_compute.FeedForwardActorFromTorso).
actor_network:
  pre_torso:
    _target_: stoix.networks.torso_compute_explicit_cot_merged.TransformerMergedActionCoTTorso
    hidden_dim: 128
    vocab_size: 32
    num_heads: 4
    num_layers: 2
    mlp_dim: 256
    max_steps: 8
    min_steps: 1 # Forbids halting before this many steps; set equal to max_steps for a
      # fixed-budget, non-adaptive baseline.
    activation: gelu
    use_latent_feedback: False # Full-Bandwidth Transformer's latent feedback decoding
      # (arXiv:2608.08888) - fuses the previous step's top-layer hidden state into the
      # next scratchpad entry via a gated linear unit instead of feeding back only the
      # sampled token's bare embedding. See torso_compute_explicit_cot_merged.py.

critic_network:
  pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: relu
  critic_head:
    _target_: stoix.networks.heads.ScalarCriticHead
