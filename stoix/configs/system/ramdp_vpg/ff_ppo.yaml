# --- Defaults Compute-Time-Aware FF-PPO (RAMDP-PPO) ---

system_name: ramdp_ff_ppo # Name of the system.

# --- RL hyperparameters ---
qac_variant: fac # How the actor's advantage is computed:
  #   "fac"        - runtime-factorized Q-V: critic learns Q(s,·,1) only, and
  #                  Q(s,a,c) = gamma^(c-1) * Q(s,a,1) is recovered by scaling
  #                  (see ff_qac.py). Advantage = Q(s,a,c) - V(s).
  #   "naive"      - Q-V with a full (num_actions, max_steps) Q table, read off
  #                  directly with no scaling assumption (see ff_qac.py).
  #   "cond_naive" - Q-V with compute_time fed into the critic as an input (a
  #                  learned linear feature, see ValueAndQCritic._q_input)
  #                  instead of the output shape/an analytic scaling; the
  #                  conditioned output is used directly as Q(s,a,c).
  #   "cond_fac"   - same conditioned architecture (and so the same parameter
  #                  count) as "cond_naive", but the conditioned output is
  #                  still scaled by gamma^(c-1) - compares against
  #                  "cond_naive" to isolate whether that analytic prior
  #                  helps, holding capacity fixed.
  #   "reinforce"  - G-V: advantage = compute-discounted n-step Monte-Carlo
  #                  return - V(s), REINFORCE-with-baseline style (see
  #                  ff_reinforce.py). Uses a plain V-only critic, no Q head.
actor_lr: 3e-4 # Learning rate for actor network
critic_lr: 3e-4 # Learning rate for critic network
actor_weight_decay: 0.0 # AdamW weight decay coefficient for the actor. 0.0 recovers plain Adam.
critic_weight_decay: 0.0 # AdamW weight decay coefficient for the critic. 0.0 recovers plain Adam.
rollout_length: 32 # Number of environment steps per vectorised environment.
epochs: 4 # Number of PPO epochs per training data batch.
num_minibatches: 16 # Number of minibatches per PPO epoch.
gamma: 0.99 # Discounting factor. Compute time is folded into this: a transition that
  # took `compute_time` pondering steps discounts through `gamma ** compute_time`
  # rather than a flat `gamma` (Semi-MDP/RAMDP formulation), so the same `gamma`
  # controls both the usual reward horizon and the cost of pondering longer, and
  # (for "fac") the Q(s,a,1) -> Q(s,a,c) scaling.
gae_lambda: 1.0 # GAE(lambda) mixing parameter for the critic's regression target
  # (`targets`/`g_targets`). 1.0 (the default) recovers the original to-the-end
  # Monte-Carlo return exactly; <1.0 blends in earlier bootstrapped value
  # estimates for a lower-variance, more-biased target. Applies regardless of
  # `qac_variant`: for the four Q-V variants it only affects what trains V (and
  # Q, for "naive"/"fac"), since their advantage is Q(s,a,c) - V(s) either way;
  # for "reinforce", whose advantage is `targets - V(s)`, this makes the
  # advantage itself GAE(lambda) rather than the n-step-to-end special case.
clip_eps: 0.2 # Clipping value for the PPO actor ratio, and for the critic's value/Q loss
  # when clip_value_loss=True. Ignored for the actor ratio (env action and halting-step
  # surrogates) when use_dpo_loss=True - still used for the critic's value/Q loss regardless.
use_dpo_loss: False # Whether the env-action and halting-step actor surrogates use Discovered
  # Policy Optimisation (stoix.utils.loss.dpo_loss/dpo_surrogate, Lu et al. 2022,
  # https://arxiv.org/abs/2210.05639) instead of PPO's clipped surrogate (stoix.utils.loss.
  # ppo_clip_loss). False (default) recovers the original ppo_clip_loss behaviour exactly.
dpo_alpha: 2.0 # DPO's alpha (positive-advantage drift coefficient) - only used when
  # use_dpo_loss=True. 2.0 is the value found by Lu et al. (2022)'s meta-optimisation.
dpo_beta: 0.6 # DPO's beta (negative-advantage drift coefficient) - only used when
  # use_dpo_loss=True. 0.6 is the value found by Lu et al. (2022)'s meta-optimisation.
clip_value_loss: True # Whether the critic's value loss (and Q loss, for "naive"/"fac") uses
  # PPO-style clipping against the old value/Q estimate recorded at rollout time
  # (stoix.utils.loss.clipped_value_loss), or plain L2 regression to the target instead
  # (rlax.l2_loss, as in ff_reinforce.py/ff_qac.py). Only affects the critic - the actor's
  # ratio is always clipped regardless of this setting. Ignored for V (not Q) when
  # use_expectile_value_loss=True, which takes over V's loss regardless of this flag.
use_expectile_value_loss: False # Whether V's loss (only V - Q, where it exists, still uses
  # clip_value_loss/plain L2 above) uses expectile regression (stoix.utils.loss.expectile_loss,
  # as in Kostrikov et al. 2021's Implicit Q-Learning, https://arxiv.org/abs/2110.06169) at
  # expectile `expectile` below, instead of PPO's clipped value loss / plain L2. False (default)
  # recovers the original clip_value_loss/L2 behaviour exactly. See ff_ppo.py's module docstring
  # for the caveats: a fixed expectile below 0.5 makes V deliberately (and persistently, not
  # uncertainty-dependent like real optimism-under-uncertainty exploration) underestimate the
  # return distribution - for the Q-V variants this mostly softens how aggressively
  # tried-but-average actions get pruned, not directed exploration towards untried ones; for
  # qac_variant="reinforce" (no Q head) there is no per-action information in the loss at all,
  # so it just reinforces whichever action was sampled a bit more.
expectile: 0.1 # V's target expectile when use_expectile_value_loss=True (ignored otherwise).
  # < 0.5 makes V converge to a lower expectile of the return distribution than its
  # conditional mean (deliberately pessimistic); > 0.5 would instead make it optimistic
  # (IQL's usual direction); 0.5 recovers plain squared-error regression. See
  # stoix.utils.loss.expectile_loss and ff_ppo.py's module docstring.
ent_coef: 0.01 # Entropy regularisation term for the environment action's distribution.
halting_ent_coef: 0.0 # Entropy regularisation term for the halting decision's own
  # distribution (per-step Bernoulli halting probability), separate from ent_coef above
  # since that only ever reaches the environment action's distribution - without this,
  # nothing keeps the halting policy from collapsing to a degenerate, non-adaptive
  # compute-time before discovering genuine per-example structure. 0.0 (default) disables
  # it exactly, recovering the original ff_ppo.py behaviour. See ff_ppo.py's module
  # docstring.
latent_kl_coef: 0.0 # Coefficient on an optional trust-region penalty for how far the
  # actor torso's per-step "thought" states (states_history) may drift across a PPO
  # update, on top of the existing halting-log-prob ratio clip (which only bounds the
  # halting *decision*, not the continuous states themselves). Interpretable as
  # 1 / (2 * sigma^2) of an isotropic Gaussian centered at each step's state: the
  # penalty is exactly KL(N(new, sigma^2 I) || N(old, sigma^2 I)) between rollout-time
  # and current-epoch states. 0.0 (default) disables it exactly, recovering the
  # original ff_ppo.py behaviour.
vf_coef: 0.5 # Critic weight.
recompute_advantages: False # Whether the advantage's "what changed" term (Q(s,a,c) for the
  # four Q-V variants, V(s) for "reinforce") and the critic's own regression target are
  # recomputed at the end of every PPO epoch from that epoch's just-updated critic params,
  # rather than staying pinned at their rollout-time values for the whole update
  # (vanilla-PPO style, the default here). False also skips the extra critic forward passes
  # that only feed this refresh, saving compute.
standardize_advantages: False # Whether to standardize the advantages.
critic_before_actor: False # Whether to replace the joint per-minibatch actor+critic
  # update with two fully sequential phases: `epochs` epochs of critic-only minibatch
  # updates, followed by `epochs` epochs of actor-only minibatch updates - instead of
  # updating both networks together in every minibatch. See ff_ppo.py's module
  # docstring. Roughly doubles the per-rollout update compute when enabled.
max_grad_norm: 0.5 # Maximum norm of the gradients for a weight update.
clip_halting_head: True # Whether the halting head's own parameters (the `HaltingHead`
  # submodule inside a compute-aware actor torso, e.g. `TransformerChainOfThoughtTorso` -
  # see stoix/networks/torso_compute_transformer.py) are subject to the actor's
  # max_grad_norm clipping like every other actor parameter (True, the default, recovers
  # the original behaviour exactly), or updated with plain unclipped AdamW instead (False)
  # - weight decay/learning rate are unaffected either way, only the clipping is skipped.
  # Only meaningful for architectures whose actor torso exposes a separately-named halting
  # head (currently just the transformer implicit-CoT torso) - raises if set False for one
  # that doesn't. See ff_ppo.py's _label_actor_params_by_halting_head.
decay_learning_rates: False # Whether learning rates should be linearly decayed during training.