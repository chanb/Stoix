# --- Defaults Merged-Action Explicit-CoT Compute-Time-Aware FF-PPO (RAMDP-PPO, merged-action explicit CoT) ---

system_name: ramdp_ff_ppo_explicit_cot_merged # Name of the system.

# --- RL hyperparameters ---
qac_variant: reinforce # How the actor's advantage is computed - see
  # ff_ppo_explicit_cot.yaml for the full menu ("fac"/"naive"/"cond_naive"/"cond_fac"
  # all still work with TransformerMergedActionCoTTorso, unmodified). This system's
  # own network config (transformer_explicit_cot_merged.yaml) only wires up the
  # plain V-only critic used by "reinforce" - no Q-function.
  #   "reinforce"  - G-V: advantage = compute-discounted n-step Monte-Carlo
  #                  return - V(s), REINFORCE-with-baseline style (see
  #                  ff_reinforce.py). Uses a plain V-only critic, no Q head.
actor_lr: 3e-4 # Learning rate for actor network
critic_lr: 3e-4 # Learning rate for critic network
actor_weight_decay: 0.0 # AdamW weight decay coefficient for the actor. 0.0 recovers plain Adam.
critic_weight_decay: 0.0 # AdamW weight decay coefficient for the critic. 0.0 recovers plain Adam.
rollout_length: 32 # Number of environment steps per vectorised environment.
epochs: 4 # Number of PPO epochs per training data batch.
num_minibatches: 16 # Number of minibatches per PPO epoch.
gamma: 0.99 # Discounting factor. Compute time is folded into this: a transition that
  # took `compute_time` pondering steps discounts through `gamma ** compute_time`
  # rather than a flat `gamma` (Semi-MDP/RAMDP formulation), so the same `gamma`
  # controls both the usual reward horizon and the cost of pondering longer.
gae_lambda: 1.0 # GAE(lambda) mixing parameter for the critic's regression target
  # (`targets`/`g_targets`). 1.0 (the default) recovers the original to-the-end
  # Monte-Carlo return exactly; <1.0 blends in earlier bootstrapped value
  # estimates for a lower-variance, more-biased target.
clip_eps: 0.2 # Clipping value for the PPO actor ratio (the single per-step CoT surrogate,
  # which now covers the halting-with-action step too - see
  # ff_ppo_explicit_cot_merged.py's module docstring), and for the critic's value
  # loss when clip_value_loss=True. Ignored for the actor ratio when
  # use_dpo_loss=True - still used for the critic's value loss regardless.
use_dpo_loss: False # Whether the per-step actor surrogate uses Discovered Policy
  # Optimisation (stoix.utils.loss.dpo_surrogate, Lu et al. 2022,
  # https://arxiv.org/abs/2210.05639) instead of PPO's clipped surrogate (stoix.utils.loss.
  # ppo_clip_loss). False (default) recovers the original ppo_clip_loss behaviour exactly.
dpo_alpha: 2.0 # DPO's alpha (positive-advantage drift coefficient) - only used when
  # use_dpo_loss=True. 2.0 is the value found by Lu et al. (2022)'s meta-optimisation.
dpo_beta: 0.6 # DPO's beta (negative-advantage drift coefficient) - only used when
  # use_dpo_loss=True. 0.6 is the value found by Lu et al. (2022)'s meta-optimisation.
clip_value_loss: True # Whether the critic's value loss uses PPO-style clipping against the
  # old value estimate recorded at rollout time (stoix.utils.loss.clipped_value_loss), or
  # plain L2 regression to the target instead (rlax.l2_loss, as in ff_reinforce.py).
use_expectile_value_loss: False # Whether V's loss uses expectile regression
  # (stoix.utils.loss.expectile_loss, as in Kostrikov et al. 2021's Implicit Q-Learning,
  # https://arxiv.org/abs/2110.06169) at expectile `expectile` below, instead of PPO's
  # clipped value loss / plain L2. False (default) recovers the original behaviour exactly.
expectile: 0.1 # V's target expectile when use_expectile_value_loss=True (ignored otherwise).
ent_coef: 0.01 # Entropy regularisation term for the whole per-step categorical (thought
  # tokens and the halting-with-action classes together) - covers what
  # ff_ppo_explicit_cot.yaml needed two separate coefficients (ent_coef/halting_ent_coef)
  # for, since here the environment action and the halting decision are the same choice.
  # See TransformerMergedActionCoTTorso's/ff_ppo_explicit_cot_merged.py's module docstrings.
vf_coef: 0.5 # Critic weight.
recompute_advantages: False # Whether the advantage's V(s) term and the critic's own
  # regression target are recomputed at the end of every PPO epoch from that epoch's
  # just-updated critic params, rather than staying pinned at their rollout-time values
  # for the whole update (vanilla-PPO style, the default here).
standardize_advantages: False # Whether to standardize the advantages.
critic_before_actor: False # Whether to replace the joint per-minibatch actor+critic
  # update with two fully sequential phases: `epochs` epochs of critic-only minibatch
  # updates, followed by `epochs` epochs of actor-only minibatch updates - instead of
  # updating both networks together in every minibatch. Roughly doubles the per-rollout
  # update compute when enabled.
max_grad_norm: 0.5 # Maximum norm of the gradients for a weight update.
decay_learning_rates: False # Whether learning rates should be linearly decayed during training.
