# --- Defaults Compute-Time-Aware Q Actor-Critic (RAMDP-QAC) ---

system_name: ramdp_qac # Name of the system.

# --- RL hyperparameters ---
qac_variant: fac # How Q(s,a,c) is obtained from the critic:
  #   "fac"   - runtime-factorized: the critic only learns Q(s,·,1) (one value
  #             per action) and Q(s,a,c) = gamma^(c-1) * Q(s,a,1) is recovered
  #             by scaling - the value implied by the RAMDP return structure.
  #   "naive" - the critic learns a full (num_actions, max_steps) table,
  #             Q(s,a,c) read off directly with no scaling assumption.
actor_lr: 3e-4 # Learning rate for actor network
critic_lr: 3e-4 # Learning rate for critic (V and Q) network
actor_weight_decay: 0.0 # AdamW weight decay coefficient for the actor. 0.0 recovers plain Adam.
actor_weight_decay_mask: all # Which actor parameters actor_weight_decay applies to (see
  # stoix.networks.weight_decay): "all" (default, the original behaviour) decays every one,
  # except the Switch MoE router(s) if moe_router_weight_decay_exempt; "standard" decays only
  # the weight matrices - biases, LayerNorm/RMSNorm parameters, pos_embedding and the Switch
  # router(s) are exempt.
critic_weight_decay: 0.0 # AdamW weight decay coefficient for the critic. 0.0 recovers plain Adam.
rollout_length: 32 # Number of environment steps per vectorised environment.
gamma: 0.99 # Discounting factor. Compute time is folded into this: a transition that
  # took `compute_time` pondering steps discounts through `gamma ** compute_time`
  # rather than a flat `gamma` (Semi-MDP/RAMDP formulation), so the same `gamma`
  # controls both the usual reward horizon and the cost of pondering longer, and
  # (for "fac") the Q(s,a,1) -> Q(s,a,c) scaling. Only used for the critic's own
  # bootstrapped return target and the "fac" scaling - the advantage itself is
  # Q(s,a,c) - V(s), with no n-step return involved.
gamma_act: null # Per-environment-step discount; null = gamma. The return is
  # G = sum_t gamma_act^t * gamma_comp^(z_t + c_t - 1) * r_t with z_t = sum_{k<t} (c_k - 1),
  # see stoix/systems/ramdp_vpg/ramdp_vpg_types.get_discounts.
gamma_comp: null # Per-extra-compute-step (pondering/CoT) discount; null = gamma.
ent_coef: 0.001 # Entropy regularisation term for loss function.
moe_load_balancing_coef: 0.01 # Switch-Transformer load-balancing loss (the paper's alpha)
  # on the actor's Switch MoE router(s) (pre_torso.num_experts > 0, moe_type=switch),
  # keeping tokens spread across experts - see stoix.networks.torso_compute_transformer.
  # SwitchMoEMLP. 0.0 turns the loss off (routing statistics are still logged); no effect
  # with soft MoE or a dense MLP.
moe_router_weight_decay_exempt: False # True exempts the Switch MoE router(s) from
  # actor_weight_decay (stoix.networks.torso_compute_transformer.
  # switch_router_weight_decay_mask): decay flattens the router softmax towards uniform,
  # making routing near-arbitrary/unstable and invisible to the load-balancing loss. False
  # (the default) decays every actor parameter, the original behaviour. No effect without a
  # Switch MoE.
vf_coef: 1.0 # Critic weight in
delightful: False # Whether to gate the REINFORCE weight by a sigmoid of
  # (advantage * surprisal / delightful_eta), where surprisal = -log_prob of the
  # sampled trajectory (stop-gradient'd). Amplifies reinforcement of
  # good-and-surprising samples, damps punishment of bad-and-surprising ones,
  # leaving already-likely samples closer to unaffected either way.
delightful_eta: 1.0 # Temperature for the delightful gate; only used if delightful=True.
max_grad_norm: 0.5 # Maximum norm of the gradients for a weight update.
decay_learning_rates: False # Whether learning rates should be linearly decayed during training.
